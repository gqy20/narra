fallback_strategies:
- strategy:
    id: generic-heal
    action_id: heal
    description: "{actor}暂缓原计划并处理伤势"
    conditions:
    - {type: injury_at_least, min_confidence: 2}
    goal_types: [avoid]
    score: {goal: 4, urgency: 5, probability: 5, cost: 1}
    effects:
    - {type: adjust_injury, amount: -1}
- strategy:
    id: generic-cultivate
    action_id: cultivate
    description: "{actor}利用空档修炼并巩固状态"
    once: true
    conditions:
    - {type: injury_at_most, max_confidence: 0}
    - {type: resource_at_most, key: combat, max_confidence: 3}
    goal_types: [status]
    score: {goal: 3, urgency: 2, probability: 5, cost: 2}
    effects:
    - {type: adjust_resource, key: combat, amount: 1}
  personality_at_least: {ambition: 4}
- strategy:
    id: generic-buy-antidote
    action_id: buy
    description: "{actor}为争夺行动补充解瘴丹"
    once: true
    conditions:
    - {type: missing_item, key: antidote}
    goal_types: [avoid, acquire]
    score: {goal: 2, urgency: 3, probability: 5, cost: 2}
    effects: []
  any_conditions:
  - {type: belief, key: F01, min_confidence: 2}
  - {type: belief, key: F04, min_confidence: 2}
  require_no_authored_strategies: true
  market_purchase: {item_id: antidote, amount: 1}

investigation:
  enabled: true
  action_id: verify
  description: "{actor}核验低可信线索：{fact}"
  goal_types: [acquire, protect]
  score: {goal: 3, urgency: 2, probability: 4, information: 5, cost: 1}

navigation:
  retreat:
    enabled: true
    action_id: flee
    description: 撤往安全地点
    min_injury: 2
    goal_types: [avoid]
    score: {base: 8, goal: 5, urgency: 5, probability: 4}
  contest:
    enabled: true
    action_id: explore
    description: 沿可行路线接近争夺目标
    knowledge_facts: [F01, F04]
    blocking_facts: [F09]
    min_confidence: 2
    min_ambition: 3
    max_injury: 2
    goal_types: [acquire]
    score: {goal: 4, urgency: 4, probability: 4}

player:
  investigation: {enabled: true, action_id: verify}
  market_purchase: {enabled: true, action_id: buy}
  movement: {enabled: true, action_id: explore}
  share_information: {enabled: true, action_id: spread}
  actions:
  - id: heal
    action_id: heal
    kind: heal
    category: self
    name: 疗伤
    description: 专心处理伤势，降低一级伤势
    command_description: 你专心疗伤
    conditions:
    - {type: injury_at_least, min_confidence: 1}
    effects:
    - {type: adjust_injury, amount: -1}
  - id: cultivate
    action_id: cultivate
    kind: cultivate
    category: self
    name: 修炼
    description: "第 {stage} 阶段闭关，{effect_resource}提高一点"
    paid_description: "第 {stage} 阶段闭关，以 {cost} {cost_resource}稳固气机，{effect_resource}提高一点；完成后累计闭关耗费 {cumulative} {cost_resource}"
    command_description: 你闭关修炼
    conditions:
    - {type: injury_at_most, max_confidence: 0}
    effects:
    - {type: adjust_resource, key: combat, amount: 1}
    repeat_cost:
      resource: spirit_stones
      amounts: [0, 0, 10, 20, 30]
    warning: "重复行动已进入高耗阶段；本轮消耗 {cost} {cost_resource}，完成后累计耗费 {cumulative} {cost_resource}。"
  resource_warnings: []

economy:
  information_trade_currency: spirit_stones
  agreement_currency: spirit_stones
