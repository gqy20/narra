- id: qinglan_intel
  title: 青岚情报路线
  initial_state: uncommitted
  states:
    - uncommitted
    - trust_committed
    - trust_reviewed
    - trust_betrayed
    - trust_joined
    - trust_commissioned
    - antidote_committed
    - antidote_lent
    - antidote_kept
    - antidote_scouted
    - antidote_liquidated
    - escort_committed
    - escort_approved
    - escort_refused
    - escort_fulfilled
    - escort_vanguard
    - escort_quartermaster
  nodes:
    - id: deliver_verified_date
      from_state: uncommitted
      target_id: N03
      fact_id: F01
      min_confidence: 3
      action_id: spread
      choices:
        - id: tell:N03:F01:trust
          term_id: trust
          term_label: 无偿相助
          name: 无偿告知沈砚秋
          description: 不索取眼前回报，以可靠消息换取沈砚秋对你的长期信任。
          personal_outcome: 沈砚秋对你的信任提高；若他凭此取得青髓芝，你会获得青岚门声望。
          expected_outcomes:
            - 沈砚秋获得已核实日期
            - 信任 +2，并可能直接采用你的消息提前备战
          warnings:
            - 条件一旦提出，情报与承诺都不可撤回。
          irreversible: true
          effects:
            - type: adjust_relation
              from_id: target
              target_id: player
              key: trust
              amount: 2
            - type: set_flag
              target_id: player
              key: qinglan_intel_term_trust
              value: "true"
            - type: set_flag
              target_id: world
              key: player_backed_shen
              value: "true"
          to_state: trust_committed

        - id: tell:N03:F01:antidote
          term_id: antidote
          term_label: 交换解瘴丹
          name: 以日期换取解瘴丹
          description: 把已核实日期作为交易筹码，立即换取一枚解瘴丹，保留独自入谷的自由。
          personal_outcome: 立即获得 1 枚解瘴丹，重新打开亲自入谷路线。
          expected_outcomes:
            - 获得沈砚秋持有的 1 枚解瘴丹
            - 青岚队伍失去这份入谷物资；沈砚秋会把消息视为一次对价交易
          warnings:
            - 条件一旦提出，情报与承诺都不可撤回。
          irreversible: true
          conditions:
            - type: missing_item
              key: antidote
          effects:
            - type: remove_item
              target_id: target
              key: antidote
              amount: 1
            - type: add_item
              target_id: player
              key: antidote
              amount: 1
            - type: set_flag
              target_id: player
              key: qinglan_intel_term_antidote
              value: "true"
            - type: set_flag
              target_id: world
              key: player_took_shen_antidote
              value: "true"
          to_state: antidote_committed

        - id: tell:N03:F01:escort
          term_id: escort
          term_label: 换取同行名额
          name: 以日期换取同行承诺
          description: 暂不拿走物资，要求沈砚秋在开谷时把你编入青岚队伍。
          personal_outcome: 获得第17日随青岚队伍出发的承诺；届时可取得随队药与 1 点支援。
          expected_outcomes:
            - 沈砚秋获得已核实日期
            - 取得开谷时随队出发的承诺，信任 +1
          warnings:
            - 条件一旦提出，情报与承诺都不可撤回。
          irreversible: true
          effects:
            - type: adjust_relation
              from_id: target
              target_id: player
              key: trust
              amount: 1
            - type: set_flag
              target_id: player
              key: qinglan_escort_promised
              value: "true"
            - type: set_flag
              target_id: player
              key: qinglan_intel_term_escort
              value: "true"
            - type: set_flag
              target_id: world
              key: player_joining_qinglan
              value: "true"
          to_state: escort_committed

    - id: answer_source_review
      from_state: trust_committed
      from_day: 10
      until_day: 12
      location_id: L02
      target_id: N09
      action_id: visit
      conditions:
        - {type: flag, key: n09_challenges_player_source}
        - {type: missing_flag, scope: actor, key: qinglan_trust_midgame_resolved}
      choices:
        - id: route:trust:vouch
          term_id: vouch
          term_label: 公开担保
          name: 为情报来源担保
          description: 在宗门审核中公开承担消息责任，不让沈砚秋独自承受赵鹤鸣的质疑。
          command_description: 玩家在宗门审核中为情报来源担保
          personal_outcome: 信用 +1，沈砚秋信任 +1；同时坐实你与沈砚秋的共同立场。
          relevance: 赵鹤鸣正在借宗门审核质疑这条消息的来源。
          risk: 担保会提高你的宗门声望，也会让赵鹤鸣把你视为沈砚秋一方。
          expected_outcomes:
            - 信用 +1
            - 沈砚秋信任 +1
            - 完成信任路线的中段履约
          warnings:
            - 公开担保后，无法再否认自己参与了沈砚秋的计划。
          irreversible: true
          effects:
            - {type: adjust_resource, target_id: player, key: credit, amount: 1}
            - {type: adjust_relation, from_id: N03, target_id: player, key: trust, amount: 1}
            - {type: set_flag, target_id: player, key: qinglan_trust_vouched, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_trust_midgame_resolved, value: "true"}
          to_state: trust_reviewed

    - id: leak_plan_during_review
      from_state: trust_committed
      from_day: 10
      until_day: 12
      location_id: L02
      target_id: N09
      fact_id: F01
      min_confidence: 3
      action_id: spread
      conditions:
        - {type: flag, key: n09_challenges_player_source}
        - {type: missing_flag, scope: actor, key: qinglan_trust_midgame_resolved}
      choices:
        - id: route:trust:leak
          term_id: leak
          term_label: 转交计划
          name: 把计划转交赵鹤鸣
          description: 否认担保，并把沈砚秋的成熟日期与备战安排交给赵鹤鸣换取报酬。
          command_description: 玩家把沈砚秋的计划转交赵鹤鸣
          personal_outcome: 立即获得 20 灵石，但沈砚秋信任 -4，信任路线转为背约。
          relevance: 赵鹤鸣需要证据削弱沈砚秋在门内的地位。
          risk: 这会把一次无偿相助变成背叛；沈砚秋会知道计划从你这里泄露。
          expected_outcomes:
            - 获得 20 灵石
            - 沈砚秋信任 -4
            - 赵鹤鸣获得已核实日期
          warnings:
            - 这是信任路线的背约选择。
          irreversible: true
          effects:
            - {type: adjust_resource, target_id: player, key: spirit_stones, amount: 20}
            - {type: adjust_relation, from_id: N03, target_id: player, key: trust, amount: -4}
            - {type: set_flag, target_id: player, key: qinglan_trust_betrayed, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_trust_midgame_resolved, value: "true"}
          to_state: trust_betrayed

    - id: answer_antidote_request
      from_state: antidote_committed
      from_day: 8
      until_day: 12
      location_id: L02
      target_id: N06
      action_id: visit
      conditions:
        - {type: has_item, key: antidote}
        - {type: flag, key: su_requests_antidote}
        - {type: missing_flag, scope: actor, key: qinglan_antidote_midgame_resolved}
      choices:
        - id: route:antidote:lend
          term_id: lend
          term_label: 借丹援队
          name: 把解瘴丹借回队伍
          description: 接受苏晚照的请求，把换来的解瘴丹交回青岚药修使用。
          command_description: 玩家把交易所得解瘴丹借给苏晚照
          personal_outcome: 失去解瘴丹与独行资格，换得 2 点支援和苏晚照 2 点信任。
          relevance: 坊市已经封锁，苏晚照无法为队伍补回这枚解瘴丹。
          risk: 交出后你的亲自入谷路线会再次关闭。
          expected_outcomes:
            - 支援 +2
            - 苏晚照信任 +2
            - 交出 1 枚解瘴丹
          warnings:
            - 交出后将失去当前的独自入谷条件。
          irreversible: true
          effects:
            - {type: remove_item, target_id: player, key: antidote, amount: 1}
            - {type: add_item, target_id: N06, key: antidote, amount: 1}
            - {type: adjust_resource, target_id: player, key: support, amount: 2}
            - {type: adjust_relation, from_id: N06, target_id: player, key: trust, amount: 2}
            - {type: set_flag, target_id: player, key: qinglan_antidote_lent, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_antidote_midgame_resolved, value: "true"}
          to_state: antidote_lent
        - id: route:antidote:keep
          term_id: keep
          term_label: 坚持独行
          name: 拒绝归还解瘴丹
          description: 明确告诉苏晚照，这枚丹药是一次完成的交易，你会保留它并独自决定入谷时机。
          command_description: 玩家拒绝把交易所得解瘴丹借回青岚队伍
          personal_outcome: 保留解瘴丹与路线自由；苏晚照对你的怀疑 +2。
          relevance: 苏晚照把队伍药物缺口摆到了你面前。
          risk: 你仍可独行，但青岚药修不会把你视为可以托付物资的人。
          expected_outcomes:
            - 保留解瘴丹
            - 苏晚照怀疑 +2
            - 确认独行路线
          warnings:
            - 拒绝后，苏晚照不会再次提出借丹请求。
          irreversible: true
          effects:
            - {type: adjust_relation, from_id: N06, target_id: player, key: suspicion, amount: 2}
            - {type: set_flag, target_id: player, key: qinglan_antidote_kept, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_antidote_midgame_resolved, value: "true"}
          to_state: antidote_kept

    - id: answer_escort_review
      from_state: escort_committed
      from_day: 10
      until_day: 13
      location_id: L02
      target_id: N03
      action_id: visit
      conditions:
        - {type: flag, key: qinglan_review}
        - {type: flag, scope: actor, key: qinglan_escort_promised}
        - {type: missing_flag, scope: actor, key: qinglan_escort_midgame_resolved}
      choices:
        - id: route:escort:review
          term_id: review
          term_label: 接受审核
          name: 接受青岚门审核
          description: 登记情报来源与行动职责，以正式队员身份保留同行资格。
          command_description: 玩家接受青岚门同行审核
          personal_outcome: 信用 +1、沈砚秋信任 +1，并保留第16日随队集结资格。
          relevance: 青岚门要求所有参与者登记情报与职责。
          risk: 通过审核后，陈氏会把你视为青岚门行动的一员。
          expected_outcomes:
            - 信用 +1
            - 沈砚秋信任 +1
            - 保留同行资格
          warnings:
            - 你的阵营立场将变得公开。
          irreversible: true
          effects:
            - {type: adjust_resource, target_id: player, key: credit, amount: 1}
            - {type: adjust_relation, from_id: N03, target_id: player, key: trust, amount: 1}
            - {type: set_flag, target_id: player, key: qinglan_escort_approved, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_escort_midgame_resolved, value: "true"}
          to_state: escort_approved
        - id: route:escort:independent
          term_id: independent
          term_label: 保持独立
          name: 退出青岚同行名单
          description: 拒绝宗门审核，保留散修身份并放弃此前换得的同行名额。
          command_description: 玩家拒绝青岚门审核并退出同行名单
          personal_outcome: 放弃随队药与支援；沈砚秋信任 -2，陈青山不再把你视为青岚阵营。
          relevance: 宗门审核要求你在安全与独立之间作出明确选择。
          risk: 退出后，第16日不会再出现随队集结。
          expected_outcomes:
            - 取消同行承诺
            - 沈砚秋信任 -2
            - 恢复公开的散修身份
          warnings:
            - 退出后不能重新申请本次同行。
          irreversible: true
          effects:
            - {type: adjust_relation, from_id: N03, target_id: player, key: trust, amount: -2}
            - {type: adjust_relation, from_id: N02, target_id: player, key: suspicion, amount: -1}
            - {type: set_flag, target_id: player, key: qinglan_escort_promised, value: "false"}
            - {type: set_flag, target_id: player, key: qinglan_escort_refused, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_escort_midgame_resolved, value: "true"}
            - {type: set_flag, target_id: world, key: player_declared_independent, value: "true"}
          to_state: escort_refused

    - id: settle_trust_commitment
      from_state: trust_reviewed
      from_day: 14
      until_day: 16
      location_id: L02
      target_id: N03
      allow_remote_target: true
      action_id: visit
      conditions:
        - {type: flag, scope: actor, key: qinglan_trust_vouched}
        - {type: missing_flag, scope: actor, key: qinglan_trust_late_resolved}
      choices:
        - id: route:trust:join
          term_id: join
          term_label: 亲自入局
          name: 把担保转为行动席位
          description: 以已经公开承担的责任换取青岚门行动物资，亲自加入入谷准备。
          personal_outcome: 获得解瘴丹、2 点支援与额外筹备；你将有机会亲自争夺，而不只等待记功。
          relevance: 你已经替沈砚秋承担消息责任，有资格要求行动资源。
          risk: 亲自加入会消耗宗门人手，也意味着你要承担入谷风险。
          expected_outcomes:
            - 获得 1 枚解瘴丹
            - 支援 +2
            - 形成额外筹备
          warnings:
            - 选择行动席位后，本轮不能再领取情报报酬。
          irreversible: true
          effects:
            - {type: add_item, target_id: player, key: antidote, amount: 1}
            - {type: adjust_resource, target_id: player, key: support, amount: 2}
            - {type: set_flag, target_id: player, key: prepared, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_trust_operation_joined, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_trust_late_resolved, value: "true"}
          to_state: trust_joined
        - id: route:trust:commission
          term_id: commission
          term_label: 领取报酬
          name: 结算情报与担保报酬
          description: 不占用青岚门行动席位，提前结算情报核验与公开担保的报酬。
          personal_outcome: 立即获得 30 灵石与 1 点信用；保留沈砚秋获胜后的记功可能。
          relevance: 可靠消息与公开担保已经替青岚门节省了核验成本。
          risk: 你不会获得宗门入谷物资，亲自争夺路线仍需自行准备。
          expected_outcomes:
            - 获得 30 灵石
            - 信用 +1
          warnings:
            - 领取报酬后，本轮不能再申请行动席位。
          irreversible: true
          effects:
            - {type: adjust_resource, target_id: player, key: spirit_stones, amount: 30}
            - {type: adjust_resource, target_id: player, key: credit, amount: 1}
            - {type: set_flag, target_id: player, key: qinglan_trust_commissioned, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_trust_late_resolved, value: "true"}
          to_state: trust_commissioned

    - id: turn_antidote_into_route
      from_state: antidote_kept
      from_day: 13
      until_day: 16
      location_id: L02
      target_id: N06
      allow_remote_target: true
      action_id: visit
      conditions:
        - {type: has_item, key: antidote}
        - {type: flag, scope: actor, key: qinglan_antidote_kept}
        - {type: missing_flag, scope: actor, key: qinglan_antidote_late_resolved}
      choices:
        - id: route:antidote:scout
          term_id: scout
          term_label: 独行踩点
          name: 用解瘴丹提前踩点
          description: 保留丹药并独自勘察谷口裂隙，把入谷自由转化为路线优势。
          personal_outcome: 保留解瘴丹，获得 2 点支援并形成额外筹备，提高亲自争夺的胜算。
          relevance: 你拥有封锁后的稀缺丹药，可以比普通散修更早试探瘴气。
          risk: 独行踩点不会修复苏晚照对你的怀疑。
          expected_outcomes:
            - 保留解瘴丹
            - 支援 +2
            - 形成额外筹备
          warnings:
            - 完成踩点后，不能再出售本轮入谷名额。
          irreversible: true
          effects:
            - {type: adjust_resource, target_id: player, key: support, amount: 2}
            - {type: set_flag, target_id: player, key: prepared, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_antidote_scouted, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_antidote_late_resolved, value: "true"}
          to_state: antidote_scouted

    - id: liquidate_antidote_route
      from_state: antidote_kept
      from_day: 13
      until_day: 16
      location_id: L02
      target_id: N04
      allow_remote_target: true
      action_id: visit
      conditions:
        - {type: has_item, key: antidote}
        - {type: flag, scope: actor, key: qinglan_antidote_kept}
        - {type: missing_flag, scope: actor, key: qinglan_antidote_late_resolved}
      choices:
        - id: route:antidote:liquidate
          term_id: liquidate
          term_label: 变现资格
          name: 转售丹药与入谷路线
          description: 把封锁后的解瘴丹和独行路线打包转售，放弃争夺并锁定个人收益。
          personal_outcome: 交出解瘴丹并获得 60 灵石；本局不再亲自参与核心争夺。
          relevance: 坊市封锁后，现成丹药和可行路线都具备溢价。
          risk: 失去解瘴丹后，你将无法进入内谷参加争夺。
          expected_outcomes:
            - 获得 60 灵石
            - 交出 1 枚解瘴丹
            - 锁定交易收益
          warnings:
            - 这会主动关闭本局亲自入谷路线。
          irreversible: true
          effects:
            - {type: remove_item, target_id: player, key: antidote, amount: 1}
            - {type: adjust_resource, target_id: player, key: spirit_stones, amount: 60}
            - {type: set_flag, target_id: player, key: qinglan_antidote_liquidated, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_antidote_late_resolved, value: "true"}
          to_state: antidote_liquidated

    - id: fulfill_escort_commitment
      from_state: escort_approved
      from_day: 16
      until_day: 16
      location_id: L02
      target_id: N03
      action_id: visit
      kind: escort
      conditions:
        - {type: flag, scope: actor, key: qinglan_escort_promised}
        - {type: flag, scope: actor, key: qinglan_escort_approved}
        - {type: missing_flag, scope: actor, key: qinglan_escort_fulfilled}
      completion_conditions:
        - {type: flag, key: valley_open}
      choices:
        - id: escort:N03:depart
          term_id: escort
          term_label: 随队集结
          name: 兑现同行承诺
          description: 在开谷前完成集结；次日领取随队解瘴丹与人手，自行决定是否跟进青岚队伍。
          command_description: 玩家兑现与沈砚秋的同行约定
          personal_outcome: 获得 1 枚解瘴丹与 1 点支援，打开开谷后的入谷路线。
          expected_outcomes:
            - 获得 1 枚解瘴丹与 1 点支援
            - 在开谷日获得前往黑风谷外围的选择
          resolves:
            - 缺少解瘴丹
          effects:
            - {type: add_item, target_id: player, key: antidote, amount: 1}
            - {type: adjust_resource, target_id: player, key: support, amount: 1}
            - {type: set_flag, target_id: player, key: qinglan_escort_fulfilled, value: "true"}
          to_state: escort_fulfilled

    - id: choose_escort_role
      from_state: escort_fulfilled
      from_day: 17
      until_day: 18
      location_id: L02
      target_id: N03
      allow_remote_target: true
      action_id: visit
      conditions:
        - {type: flag, scope: actor, key: qinglan_escort_fulfilled}
        - {type: missing_flag, scope: actor, key: qinglan_escort_late_resolved}
      choices:
        - id: route:escort:vanguard
          term_id: vanguard
          term_label: 担任先锋
          name: 接下先锋分工
          description: 带领随队人手先行探路，把同行承诺转化为正面争夺准备。
          personal_outcome: 支援 +3并形成额外筹备；按时抵达后具备与主要争夺者正面对抗的实力。
          relevance: 你已经通过审核并完成集结，队伍可以把一组人手交由你指挥。
          risk: 先锋要亲自承担谷口风险，不能同时领取后勤报酬。
          expected_outcomes:
            - 支援 +3
            - 形成额外筹备
            - 获得独立指挥权
          warnings:
            - 选择先锋后，本轮不能改领后勤报酬。
          irreversible: true
          effects:
            - {type: adjust_resource, target_id: player, key: support, amount: 3}
            - {type: set_flag, target_id: player, key: prepared, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_escort_vanguard, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_escort_late_resolved, value: "true"}
          to_state: escort_vanguard
        - id: route:escort:quartermaster
          term_id: quartermaster
          term_label: 负责后勤
          name: 负责随队后勤
          description: 不争先锋位置，负责分配丹药、路线与补给，提前结算个人报酬。
          personal_outcome: 获得 30 灵石、2 点信用与 1 点支援；仍可入谷，但不以正面争夺为主要回报。
          relevance: 队伍集结后需要熟悉情报来源的人统一物资与路线。
          risk: 后勤收益稳定，但不会提供足以压过主要争夺者的战力。
          expected_outcomes:
            - 获得 30 灵石
            - 信用 +2
            - 支援 +1
          warnings:
            - 选择后勤后，本轮不能改任先锋。
          irreversible: true
          effects:
            - {type: adjust_resource, target_id: player, key: spirit_stones, amount: 30}
            - {type: adjust_resource, target_id: player, key: credit, amount: 2}
            - {type: adjust_resource, target_id: player, key: support, amount: 1}
            - {type: set_flag, target_id: player, key: qinglan_escort_quartermaster, value: "true"}
            - {type: set_flag, target_id: player, key: qinglan_escort_late_resolved, value: "true"}
          to_state: escort_quartermaster

  consequence_rules:
    - id: trust-rewarded
      states: [trust_reviewed, trust_joined, trust_commissioned]
      conditions: [{type: flag, scope: actor, key: qinglan_trust_rewarded}]
      text: 你在宗门审核中兑现了担保；沈砚秋取得青髓芝后为你记功，你获得 2 点信用与 1 点支援。
    - id: trust-betrayed
      states: [trust_betrayed]
      text: 你把沈砚秋的计划转交赵鹤鸣换取 20 灵石；沈砚秋对你的最终信任为 {{value}}。
      relation_from_id: N03
      relation_to_id: player
      relation_metric: trust
    - id: trust-vouched
      states: [trust_reviewed, trust_joined, trust_commissioned]
      conditions: [{type: missing_flag, scope: actor, key: qinglan_trust_rewarded}]
      text: 你公开为消息担保并完成了信任路线的履约；沈砚秋对你的最终信任为 {{value}}。
      relation_from_id: N03
      relation_to_id: player
      relation_metric: trust
    - id: trust-review-missed
      states: [trust_committed]
      text: 你最初无偿帮助沈砚秋，却没有回应赵鹤鸣的公开质疑；关系停留在 {{value}} 点信任，未形成宗门记功。
      relation_from_id: N03
      relation_to_id: player
      relation_metric: trust
    - id: trust-operation-joined
      states: [trust_joined]
      text: 你把公开担保兑现为行动席位，取得解瘴丹、2 点支援与额外筹备，获得亲自争夺的完整条件。
    - id: trust-commissioned
      states: [trust_commissioned]
      text: 你没有占用青岚门行动席位，而是把情报与担保结算为 30 灵石和 1 点信用。

    - id: antidote-request-missed
      states: [antidote_committed]
      text: 你用成熟日期换得解瘴丹，但没有正面回应苏晚照的借丹请求；丹药仍是你的独行筹码。
    - id: antidote-lent
      states: [antidote_lent]
      text: 苏晚照提出队伍药物缺口后，你交回解瘴丹，放弃独行资格并换得 2 点支援与她的信任。
    - id: antidote-kept
      states: [antidote_kept, antidote_scouted, antidote_liquidated]
      text: 你拒绝归还交易所得的解瘴丹，保留独自决定入谷时机的自由，也失去了苏晚照的信任。
    - id: antidote-scouted
      states: [antidote_scouted]
      text: 你用稀缺解瘴丹提前踩点，保留丹药并取得 2 点支援与额外筹备。
    - id: antidote-liquidated
      states: [antidote_liquidated]
      text: 你主动放弃核心争夺，把解瘴丹与独行路线转售为 60 灵石，锁定了个人交易收益。

    - id: escort-review-missed
      states: [escort_committed]
      text: 你换得同行承诺，却没有完成宗门审核，因而失去了第16日的集结资格。
    - id: escort-assembly-missed
      states: [escort_approved]
      text: 你通过了青岚门审核，却没有在开谷前返回驻地集结，同行承诺最终失效。
    - id: escort-refused
      states: [escort_refused]
      text: 你在宗门审核时退出同行名单，放弃随队收益并保留了公开的散修身份。
    - id: escort-fulfilled
      states: [escort_fulfilled, escort_vanguard, escort_quartermaster]
      text: 你通过青岚门审核并兑现同行承诺，取得随队解瘴丹与 1 点支援。
    - id: escort-vanguard
      states: [escort_vanguard]
      text: 你在集结后接下先锋分工，取得 3 点支援、额外筹备与独立指挥权。
    - id: escort-quartermaster
      states: [escort_quartermaster]
      text: 你选择负责随队后勤，获得 30 灵石、2 点信用与 1 点支援。
    - id: escort-chen-affiliation
      states: [escort_committed, escort_approved, escort_refused, escort_fulfilled, escort_vanguard, escort_quartermaster]
      conditions:
        - {type: flag, key: chen_treats_player_as_qinglan}
        - {type: missing_flag, key: player_declared_independent}
      text: 陈青山已经把你视为青岚门行动的一员，陈氏后续合作将以阵营关系重新评估。

