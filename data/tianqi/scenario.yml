id: tianqi_t00
title: 天变邸抄：五月初六
duration: 15
planning_mode: authored_priority
topics: [inquiry, ledger, supply, witness, survivors, register, relief, politics, press, rumor, cause, evidence, forgery, draft, transport]
markets: []
directives:
- id: exposure-watched
  description: 多次公开经手材料后，有人开始记录玩家的往返路线与接触对象
  trigger: player_resource_at_least
  key: exposure
  from_day: 2
  until_day: 13
  min_value: 2
  priority: 80
  max_uses: 1
  effects:
  - {type: set_flag, scope: world, target_id: world, key: exposure_watched, value: "true"}
- id: exposure-investigated
  description: 玩家暴露继续上升，会勘官署要求说明材料来源，并迫使证人考虑转移
  trigger: player_resource_at_least
  key: exposure
  from_day: 3
  until_day: 13
  min_value: 4
  priority: 100
  max_uses: 1
  effects:
  - {type: set_flag, scope: world, target_id: world, key: exposure_watched, value: "true"}
  - {type: set_flag, scope: world, target_id: world, key: source_inquiry_open, value: "true"}
  - {type: open_opportunity, target_id: world, key: answer_source_inquiry, value: 会勘公署正在等待一份有限来源说明}
  - {type: open_opportunity, target_id: world, key: relocate_witness, value: 叶春娘可以协助秘密转移一名关键证人}
- id: exposure-compromised
  description: 玩家身份与主要来源已经暴露，公开署名文本的刊载和递送渠道受到阻断
  trigger: player_resource_at_least
  key: exposure
  from_day: 5
  until_day: 13
  min_value: 6
  priority: 120
  max_uses: 1
  effects:
  - {type: set_flag, scope: world, target_id: world, key: exposure_watched, value: "true"}
  - {type: set_flag, scope: world, target_id: world, key: source_inquiry_open, value: "true"}
  - {type: set_flag, scope: world, target_id: world, key: exposure_compromised, value: "true"}
  - {type: set_flag, scope: world, target_id: world, key: publication_blocked, value: "true"}
  - {type: open_opportunity, target_id: world, key: answer_source_inquiry, value: 会勘公署正在等待一份有限来源说明}
  - {type: open_opportunity, target_id: world, key: relocate_witness, value: 叶春娘可以协助秘密转移一名关键证人}
opportunity_actions:
- id: opportunity:answer-source-inquiry
  key: answer_source_inquiry
  action_id: visit
  name: 向会勘公署提交有限来源说明
  description: 只说明材料形成时间和保管链，不交出匿名证人与完整互证者名单；消耗一点证据资源，降低一点暴露
  location_id: L03
  duration: 1
  costs: {evidence: 1}
  effects:
  - {type: set_flag, scope: world, target_id: world, key: source_accounted, value: "true"}
  - {type: adjust_resource, key: exposure, amount: -1}
  - {type: close_opportunity, target_id: world, key: answer_source_inquiry}
  - {type: close_opportunity, target_id: world, key: relocate_witness}
- id: opportunity:relocate-witness
  key: relocate_witness
  action_id: visit
  name: 请叶春娘把刘六安转往城南寄寓
  description: 动用一层盟援更换刘六安的住处和联络人，使地图位置真实改变并降低一点暴露，但不回答官署对来源的疑问
  location_id: L02
  duration: 1
  costs: {allies: 1}
  effects:
  - {type: set_flag, scope: world, target_id: world, key: witness_relocated, value: "true"}
  - {type: set_flag, scope: world, target_id: world, key: witness_protected, value: "true"}
  - {type: set_story_state, key: witness_route, value: protected}
  - {type: move, target_id: N03, value: L07}
  - {type: adjust_resource, key: exposure, amount: -1}
  - {type: close_opportunity, target_id: world, key: answer_source_inquiry}
  - {type: close_opportunity, target_id: world, key: relocate_witness}
phases:
- {id: disaster, name: 灾变与救援, from_day: 1, to_day: 2}
- {id: collection, name: 封锁与收拢, from_day: 3, to_day: 5}
- {id: divergence, name: 证词与文本分叉, from_day: 6, to_day: 9}
- {id: closure, name: 归责与定稿, from_day: 10, to_day: 14}
- {id: aftermath, name: 余波, from_day: 15, to_day: 15}
fixed_events:
- id: EV01
  day: 1
  timing: start
  description: 王恭厂一带灾变后的救援继续进行，奉命查勘与灾损登记同时展开。
  effects:
  - {type: set_flag, scope: world, target_id: world, key: inquiry_open, value: "true"}
- id: EV03
  day: 3
  timing: start
  description: 官署要求上交民间捡拾的厂区文书，现场清理使原始位置关系迅速消失。
  effects:
  - {type: set_flag, scope: world, target_id: world, key: evidence_window_narrowing, value: "true"}
- id: EV04
  day: 4
  timing: start
  description: 修省、优恤与灾异解释进入官员讨论，灾变开始产生超出会勘本身的政治后果。
  effects:
  - {type: set_flag, scope: world, target_id: world, key: revision_debate, value: "true"}
- id: EV05
  day: 5
  timing: start
  description: 一份来源不明的外来人员名单在街巷传播，奸细纵火说开始获得听众。
  effects:
  - {type: set_flag, scope: world, target_id: world, key: spy_rumor_public, value: "true"}
- id: EV07
  day: 7
  timing: start
  description: 会勘官署形成“火药失慎、责任待核”的第一份内部稿。
  effects:
  - {type: set_flag, scope: world, target_id: world, key: negligence_draft, value: "true"}
- id: EV09
  day: 9
  timing: start
  description: 优恤官册接近封存，无法及时完成身份互证的姓名将失去本轮登记机会。
  effects:
  - {type: set_flag, scope: world, target_id: world, key: relief_register_closing, value: "true"}
- id: EV11
  day: 11
  timing: start
  description: 一套文面完整的灾后账册被作为寻回材料送进会勘公署核验。
  effects:
  - {type: set_flag, scope: world, target_id: world, key: forged_ledger_submitted, value: "true"}
- id: EV15
  day: 15
  timing: start
  description: 京师另一处火灾再次引发陈言；已经完成的会勘却没有自动重启。
  effects: []
contest:
  day: 14
  item_id: official_draft
  location_id: L03
  required_item_id: ""
  score_resources: [authority, evidence, allies]
  preparation_flag: prepared
  early_outcome: "{winner}提前定稿。这份文书就此成为官署采用的版本。"
  cancelled_outcome: "第十四日定稿程序取消：{outcome}"
  no_winner_outcome: 会勘逾期未成，官署以“原因未明”封存材料。
  default_outcome: "{winner}主导定稿。官署以厂内失慎结案，爆炸成因未明。"
  outcome_rules:
  - id: bounded-official-report
    priority: 120
    winner_id: N02
    required_world_flags: [systemic_caveat]
    template: "{winner}主导定稿。报告承认记录冲突与管理积弊，爆炸成因列为未决。"
  - id: correlated-ledger-report
    priority: 115
    required_world_flags: [forged_ledger_exposed, ledger_chain_correlated]
    template: "{winner}主导定稿。会勘确认军需账目长期被改，灾后又有人补造账册；爆炸成因仍无定论。"
  - id: forged-ledger-exposed
    priority: 110
    required_world_flags: [forged_ledger_exposed]
    template: "{winner}主导定稿。补造账册被揭穿，军需旧账重开，爆炸成因仍未决。"
  - id: press-version
    priority: 100
    winner_id: N07
    template: "{winner}抢先刊出民间长抄。更多见闻得以流传，未经互证的说法也混入其中。"
  - id: remonstrance-version
    priority: 90
    winner_id: N05
    template: "{winner}把灾变写入陈言。军需积弊进入朝议，部分证据仍受质疑。"
  reward_rules:
  - id: official-source-credit
    priority: 100
    winner_id: N02
    required_player_flags: [player_kept_original]
    min_winner_trust: 1
    suffix: 你因保全原件被列为经手人，来源随之公开。
    effects:
    - {type: adjust_resource, target_id: player, key: authority, amount: 1}
    - {type: adjust_resource, target_id: player, key: exposure, amount: 1}
