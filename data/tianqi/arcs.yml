- id: residual_page
  title: E01交割残页
  initial_state: unclaimed
  states: [unclaimed, original_held, copy_held, delivered_official, delivered_grey, published_bounded, published_sensational]
  nodes:
  - id: choose_residual_page_custody
    from_state: unclaimed
    until_day: 2
    location_id: L01
    target_id: N07
    action_id: inquire
    kind: route
    category: investigate
    choices:
    - id: route:e01:keep-original
      term_id: keep_original
      term_label: 保管原件
      name: 接下交割残页原件
      description: 余墨林愿意把刚取得的残页交给你辨认；原件能留下存疑旁注，也会把追查风险带到你身上。
      command_description: 玩家从余墨林处接下E01原件
      personal_outcome: 获得E01原件，证据+1、暴露+1；书坊暂时失去原件控制。
      relevance: 残页可能连接灾前交割记录与灾后补账，但单页不能证明爆炸成因。
      risk: 原件经手人可能同时受到官署收缴与灰网追索。
      expected_outcomes: [取得E01原件, 保留原页存疑旁注, 打开官署与灰网两条交付路线]
      warnings: [原件只能由一方持有，转交后不能自动取回。]
      irreversible: true
      effects:
      - {type: transfer_unique, from_id: target, target_id: player, key: e01_original}
      - {type: adjust_resource, target_id: player, key: evidence, amount: 1}
      - {type: adjust_resource, target_id: player, key: exposure, amount: 1}
      - {type: set_flag, target_id: player, key: player_kept_original, value: "true"}
      to_state: original_held
      feedback: {messages: [你接下了交割残页原件，旁注中的存疑语气仍然清楚。], journal: [E01原件由余墨林转交给你；它只能证明一处记录异常。], presentation: {kind: acquire, intensity: 2, subject: player}}
    - id: route:e01:copy-only
      term_id: copy_only
      term_label: 只留抄件
      name: 只抄一份，不碰原件
      description: 你逐字抄下残页并保留限定语，让余墨林继续处置原件。
      command_description: 玩家只抄录E01并拒绝保管原件
      personal_outcome: 获得E01抄件，盟援+1；避免成为原件经手人，但无法控制原件去向。
      relevance: 抄件可以传播内容，却难以独立证明纸张、印戳和来源。
      risk: 原件若落入灰网，抄件会面对来源质疑。
      expected_outcomes: [取得一份保留限定语的抄件, 余墨林继续持有原件]
      warnings: [抄件不能代替原件完成全部格式核验。]
      irreversible: true
      effects:
      - {type: add_item, target_id: player, key: e01_copy, amount: 1}
      - {type: adjust_resource, target_id: player, key: allies, amount: 1}
      - {type: set_flag, target_id: player, key: player_kept_copy, value: "true"}
      - {type: set_flag, scope: world, target_id: world, key: press_has_e01_copy, value: "true"}
      to_state: copy_held
      feedback: {messages: [你留下了保留限定语的抄件，却放弃控制原件去向。], journal: [E01抄件形成；原件仍在余墨林手中。], presentation: {kind: acquire, intensity: 1, subject: player}}

  - id: deliver_original_to_office
    from_state: original_held
    from_day: 3
    until_day: 10
    location_id: L03
    target_id: N02
    fact_id: F01
    min_confidence: 2
    action_id: spread
    choices:
    - id: route:e01:official
      term_id: official
      term_label: 原件入档
      name: 把原件交给裴慎行核验
      description: 让残页进入会勘材料，并要求在登记中保留“只能证明记录异常”的边界。
      command_description: 玩家将E01原件交给会勘官署
      personal_outcome: 权势+1，裴慎行信任+1；你成为公开材料经手人。
      relevance: 官署能够核验印戳与格式，也可能把残页压缩为支持既有初稿的一句话。
      risk: 原件进入官档后，你无法再决定它是否公开。
      expected_outcomes: [官署取得E01原件, 打开E09格式核验线索, 裴慎行信任+1]
      warnings: [交官后无法把原件再交给书坊或灰网。]
      irreversible: true
      effects:
      - {type: transfer_unique, from_id: player, target_id: target, key: e01_original}
      - {type: set_flag, scope: world, target_id: world, key: official_has_e01, value: "true"}
      - {type: adjust_resource, target_id: player, key: authority, amount: 1}
      - {type: adjust_relation, from_id: target, target_id: player, key: trust, amount: 1}
      - {type: set_belief, target_id: player, fact_id: F04, claim: 新送入官署的完整账册可能存在纸墨与印记问题, confidence: 1, evidence_strength: 1, source: N02, propagation: private, secrecy: 2}
      to_state: delivered_official
      feedback: {messages: [E01原件进入会勘登记，裴慎行承诺先核验格式再引用。], journal: [将E01原件交官；同时得知一套过于完整的新账册即将送入。], presentation: {kind: reveal, intensity: 2, subject: fact}}

  - id: deliver_original_to_grey_network
    from_state: original_held
    from_day: 3
    until_day: 10
    location_id: L05
    target_id: N09
    fact_id: F01
    min_confidence: 2
    action_id: spread
    choices:
    - id: route:e01:grey
      term_id: grey
      term_label: 换取保护
      name: 把原件交给罗三槐
      description: 以原件换取灰网的临时保护和两点盟援，但放弃追查账目来源。
      command_description: 玩家把E01原件交给罗三槐换取保护
      personal_outcome: 盟援+2、暴露-1；罗三槐信任+1，官署失去原件核验机会。
      relevance: 罗三槐最清楚残页会伤到谁，也最有能力让它从公开材料中消失。
      risk: 这会帮助补造账册成为最完整的官方候选版本。
      expected_outcomes: [获得灰网临时保护, 罗三槐控制E01原件]
      warnings: [原件交出后，揭穿E09将更困难。]
      irreversible: true
      effects:
      - {type: transfer_unique, from_id: player, target_id: target, key: e01_original}
      - {type: set_flag, scope: world, target_id: world, key: grey_has_e01, value: "true"}
      - {type: adjust_resource, target_id: player, key: allies, amount: 2}
      - {type: adjust_resource, target_id: player, key: exposure, amount: -1}
      - {type: adjust_relation, from_id: target, target_id: player, key: trust, amount: 1}
      to_state: delivered_grey
      feedback: {messages: [罗三槐收走原件并给出临时保护，残页从公开核验链中消失。], journal: [以E01原件换取灰网保护；补造账册获得更大空间。], presentation: {kind: danger, intensity: 3, subject: target}}

  - id: publish_e01_copy
    from_state: copy_held
    from_day: 3
    until_day: 10
    location_id: L04
    target_id: N07
    fact_id: F01
    min_confidence: 2
    action_id: spread
    choices:
    - id: route:e01:bounded-copy
      term_id: bounded
      term_label: 保留限定
      name: 按证据等级编入抄报
      description: 明写残页只能证明记录异常，不能推出实物流向与爆炸成因。
      command_description: 玩家要求余墨林按证据等级刊载E01抄件
      personal_outcome: 盟援+1、证据+1；传播较慢，但文本更能经受质疑。
      relevance: 抄报能保存官档之外的材料，也会放大排版和措辞造成的影响。
      risk: 来源仍可能被追查，抄件也无法完成纸墨核验。
      expected_outcomes: [保留E01限定语, 余墨林信任+1]
      warnings: [公开传播会增加消息来源暴露。]
      irreversible: true
      effects:
      - {type: adjust_resource, target_id: player, key: evidence, amount: 1}
      - {type: adjust_resource, target_id: player, key: allies, amount: 1}
      - {type: adjust_resource, target_id: player, key: exposure, amount: 1}
      - {type: adjust_relation, from_id: target, target_id: player, key: trust, amount: 1}
      to_state: published_bounded
      feedback: {messages: [抄报保留了“只能证明记录异常”的限定。], journal: [以分级措辞公开E01抄件。], presentation: {kind: reveal, intensity: 2, subject: fact}}
    - id: route:e01:sensational-copy
      term_id: sensational
      term_label: 强化因果
      name: 把残页写成军需侵盗实证
      description: 删除限定语，让抄报直接把账面异常写成官物被侵盗。
      command_description: 玩家允许余墨林把E01写成军需侵盗实证
      personal_outcome: 权势+2、暴露+2；传播更快，但混淆账面异常与实物流向。
      relevance: 强烈结论更容易进入政治讨论，也更容易被一处反证整体击穿。
      risk: 这是对现有证据的过度表述。
      expected_outcomes: [快速扩大政治影响, 提高后续反驳风险]
      warnings: [这项表述超过E01实际能够证明的范围。]
      irreversible: true
      effects:
      - {type: adjust_resource, target_id: player, key: authority, amount: 2}
      - {type: adjust_resource, target_id: player, key: exposure, amount: 2}
      - {type: adjust_relation, from_id: N06, target_id: player, key: suspicion, amount: 2}
      to_state: published_sensational
      feedback: {messages: [限定语被删去，残页开始被当作军需侵盗的直接证明。], journal: [选择用超过证据边界的措辞扩大E01影响。], presentation: {kind: danger, intensity: 3, subject: fact}}
  progress_rules:
  - {id: e01-unclaimed, priority: 100, from_day: 1, until_day: 2, conditions: [{type: missing_flag, scope: actor, key: player_kept_original}, {type: missing_flag, scope: actor, key: player_kept_copy}], route_id: e01, label: 交割残页, status: 原件仍在余墨林手中, next_step: 前往王恭厂外街决定是否接手, window: 第2日前, deadline_day: 2, location_id: L01, personal_return: 取得一条可进入官署、书坊或灰网的关键材料, urgent: true}
  - {id: e01-original-held, priority: 110, conditions: [{type: flag, scope: actor, key: player_kept_original}], route_id: e01, label: 交割残页, status: 你正在保管原件, next_step: 核验后决定交官、交给灰网或继续持有, window: 第10日前价值最高, deadline_day: 10, personal_return: 原件具有最高核验价值，也带来最高暴露, urgent: true}
  consequence_rules:
  - {id: e01-unclaimed-result, states: [unclaimed], text: 玩家没有接手E01；原件按默认链条落入军需灰网，书坊只留下缺少物证能力的抄件。}
  - {id: e01-held-result, states: [original_held], text: 玩家保留E01原件直到定稿，材料没有被任何机构正式核验，也使玩家成为唯一公开风险承担者。}
  - {id: e01-copy-held-result, states: [copy_held], text: 玩家保留E01抄件却没有决定传播方式，原件去向与抄件可信度同时失去控制。}
  - {id: e01-official-result, states: [delivered_official], text: E01原件进入官署核验链，补造账册更难成为唯一完整版本。}
  - {id: e01-grey-result, states: [delivered_grey], text: 军需灰网控制E01原件，玩家获得保护但削弱了公开核验。}
  - {id: e01-bounded-result, states: [published_bounded], text: E01抄件保留限定语流传，形成官档之外较可信但来源较弱的版本。}
  - {id: e01-sensational-result, states: [published_sensational], text: E01被过度表述，政治影响上升，整份文本也更容易被反驳。}

- id: witness_route
  title: E07幸存者证词
  initial_state: unresolved
  states: [unresolved, protected, officialized]
  nodes:
  - id: decide_witness_protection
    from_state: unresolved
    from_day: 2
    until_day: 6
    location_id: L02
    target_id: N03
    fact_id: F02
    min_confidence: 2
    action_id: spread
    choices:
    - id: route:e07:protect
      term_id: protect
      term_label: 匿名保全
      name: 先匿名保全第一版证词
      description: 与叶春娘共同记录询问时间和原话，暂不公开刘六安住处与姓名。
      command_description: 玩家帮助匿名保全刘六安第一版证词
      personal_outcome: 证据+1、盟援+1；避免第六日自动改口，但短期权势不增加。
      relevance: 证词价值取决于版本时间线，而不只取决于最后一次签字。
      risk: 保护证人会让官署怀疑你隐匿材料。
      expected_outcomes: [保留第一版证词, 推迟受控询问, 叶春娘信任+1]
      warnings: [匿名保护会降低证词立即进入官档的速度。]
      irreversible: true
      effects:
      - {type: set_flag, scope: world, target_id: world, key: witness_protected, value: "true"}
      - {type: set_flag, target_id: player, key: player_protected_witness, value: "true"}
      - {type: adjust_resource, target_id: player, key: evidence, amount: 1}
      - {type: adjust_resource, target_id: player, key: allies, amount: 1}
      - {type: adjust_relation, from_id: N08, target_id: player, key: trust, amount: 1}
      to_state: protected
      feedback: {messages: [刘六安第一版证词被按时间匿名保存，住处暂未写入公开材料。], journal: [保护E07早期版本，拒绝用公开姓名换取即时权威。], presentation: {kind: actor_focus, intensity: 2, subject: target}}
    - id: route:e07:official
      term_id: official
      term_label: 立即入档
      name: 立即带刘六安去会勘公署
      description: 让证词尽快取得官样记录，但接受官署在询问中整理措辞。
      command_description: 玩家带刘六安接受会勘正式询问
      personal_outcome: 权势+1、暴露+1；裴慎行获得证词，刘六安更早进入受控流程。
      relevance: 正式记录提高行政效力，也会让最后签字版本覆盖公众对早期口述的认识。
      risk: 刘六安可能为了优恤和安全调整说法。
      expected_outcomes: [证词进入官署, 玩家权势+1, 刘六安对玩家疑虑增加]
      warnings: [正式询问不等于证词不受压力。]
      irreversible: true
      effects:
      - {type: set_belief, target_id: N02, fact_id: F02, claim: 刘六安说爆炸前有一次不合常例的操作, confidence: 2, evidence_strength: 2, source: player, propagation: private, secrecy: 1}
      - {type: adjust_resource, target_id: player, key: authority, amount: 1}
      - {type: adjust_resource, target_id: player, key: exposure, amount: 1}
      - {type: adjust_relation, from_id: target, target_id: player, key: suspicion, amount: 1}
      to_state: officialized
      feedback: {messages: [刘六安进入正式询问流程，他的证词开始被整理成官样文本。], journal: [选择E07立即入档，换取行政效力并承担证词污染风险。], presentation: {kind: danger, intensity: 2, subject: target}}
  consequence_rules:
  - {id: witness-unresolved-result, states: [unresolved], text: 玩家没有介入E07；刘六安在压力下改口，官署只保留更适合失慎归责的版本。}
  - {id: witness-protected-result, states: [protected], text: 刘六安第一版证词与后续口供并存，官署无法把改口当作唯一版本。}
  - {id: witness-official-result, states: [officialized], text: 刘六安取得有限官署保护，但整理后的口供在公共叙事中覆盖了早期说法。}

- id: survivor_register
  title: E08灾民自建名册
  initial_state: collecting
  states: [collecting, verified, published]
  nodes:
  - id: decide_register_route
    from_state: collecting
    from_day: 2
    until_day: 8
    location_id: L02
    target_id: N08
    action_id: visit
    kind: route
    category: social
    choices:
    - id: route:e08:verify
      term_id: verify_register
      term_label: 分级核名
      name: 帮叶春娘分级核实名册
      description: 把姓名分成双重互证、单一证言和待认领三层，先争取部分人进入官册。
      command_description: 玩家帮助叶春娘分级核验E08
      personal_outcome: 证据+1、盟援+2；获得灾民信任，但占用名册关闭前的行动时间。
      relevance: 民间名册不是完整死亡数字，却能证明官册之外存在具体的人。
      risk: 核名越细，越要谨慎处理住址和证人身份。
      expected_outcomes: [部分无籍者取得行政承认, E08保留证据等级, 灾民盟援+2]
      warnings: [名册工作不会直接解释爆炸成因。]
      irreversible: true
      effects:
      - {type: set_flag, scope: world, target_id: world, key: register_verified, value: "true"}
      - {type: set_flag, target_id: player, key: player_verified_register, value: "true"}
      - {type: adjust_resource, target_id: player, key: evidence, amount: 1}
      - {type: adjust_resource, target_id: player, key: allies, amount: 2}
      - {type: adjust_relation, from_id: target, target_id: player, key: trust, amount: 2}
      to_state: verified
      feedback: {messages: [名册被分成三层，第一批双重互证姓名可以递交官署。], journal: [帮助E08分级核名，让一部分现实救济先发生。], presentation: {kind: recovery, intensity: 2, subject: target}}
    - id: route:e08:publish
      term_id: publish_register
      term_label: 整体刊出
      name: 把完整名册交给书坊
      description: 不等待官署逐一核籍，先把所有姓名与失踪记录交给余墨林保存。
      command_description: 玩家推动E08完整进入书坊传播
      personal_outcome: 权势+1、暴露+1；姓名更难消失，但当期优恤改善有限。
      relevance: 民间传播擅长保存记忆，不等于能够立即改变行政分配。
      risk: 未匿名的住址和证人可能随文本一起暴露。
      expected_outcomes: [完整名册进入民间保存, 扩大灾民议题影响]
      warnings: [未经分级的失踪与死亡数字容易被混用。]
      irreversible: true
      effects:
      - {type: set_flag, scope: world, target_id: world, key: register_published, value: "true"}
      - {type: adjust_resource, target_id: player, key: authority, amount: 1}
      - {type: adjust_resource, target_id: player, key: exposure, amount: 1}
      to_state: published
      feedback: {messages: [E08完整副本进入书坊网络，官册外姓名获得了另一种保存。], journal: [选择先传播E08，保存记忆但放弃部分当期优恤效率。], presentation: {kind: reveal, intensity: 2, subject: target}}
  consequence_rules:
  - {id: register-unresolved-result, states: [collecting], text: 玩家没有帮助E08进入行政或传播渠道；官册封存后，大量官册外姓名只留在叶春娘手中的民间记录。}
  - {id: register-verified-result, states: [verified], text: 一部分无籍者凭分级互证进入官册，E08同时保留未能核实者。}
  - {id: register-published-result, states: [published], text: E08作为民间记录广泛保存，但多数官册外姓名未赶上本轮优恤。}

- id: final_caveat
  title: 定稿中的证据边界
  initial_state: open
  states: [open, caveat_lodged, forgery_exposed]
  nodes:
  - id: lodge_causation_caveat
    from_state: open
    from_day: 8
    until_day: 12
    location_id: L06
    target_id: N06
    fact_id: F06
    min_confidence: 3
    action_id: spread
    choices:
    - id: route:final:caveat
      term_id: caveat
      term_label: 保留未决
      name: 请沈惟实递交成因限定
      description: 以多份现场记录为依据，要求最终文本明确“尚不能确认唯一物理过程”。
      command_description: 玩家请沈惟实把成因未决写入会勘意见
      personal_outcome: 证据+1、沈惟实信任+2；降低形成爽快定论的可能，也得罪要求迅速归责的人。
