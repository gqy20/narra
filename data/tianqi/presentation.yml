brand: 天变邸抄
world_title: 天启六年 · 京师王恭厂灾变
objective: 第十四日封稿前，保住证人与材料，决定官册和会勘报告最终写下什么
intro: 一场灾变留下冲突的证词、残账与传言。你将决定哪些内容进入正式记录。
prologue:
  skippable: true
  beats:
  - text: |-
      天启六年五月初六。
      京师西南，王恭厂。
    duration: 2.2
    font: display
    font_size: 40
    position: center
  - text: |-
      一声巨响掀倒沿街屋宇。
      存放火药与军需物料的王恭厂，已成废墟。
    duration: 3.2
    font: narrative
    font_size: 31
    position: lower_left
  - text: |-
      没人说得清这是失火、地震，还是人为纵火。
      官署开始会勘，街巷里却已有人高喊“奸细作乱”。
    duration: 3.8
    font: body
    font_size: 28
    position: lower_left
  - text: |-
      你是替邸舍与书坊抄录消息的抄手。
      与你约定见面的库吏周良辅失踪，只留下一页残账。
    duration: 3.8
    font: narrative
    font_size: 30
    position: lower_center
  - text: |-
      十四日后，会勘报告与灾民官册封定。
      谁被记下、谁来担责、哪种说法成为历史，都将在那一天决定。
    await_input: true
    font: display
    font_size: 30
    position: lower_center
start_action: 走进王恭厂外街
