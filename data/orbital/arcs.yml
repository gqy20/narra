- id: command_deck_intel
  title: 指挥部数据路线
  initial_state: uncommitted
  states:
    - uncommitted
    - trust_committed
    - trust_reviewed
    - trust_betrayed
    - trust_joined
    - trust_commissioned
    - eva_suit_committed
    - eva_suit_lent
    - eva_suit_kept
    - eva_suit_scouted
    - eva_suit_liquidated
    - escort_committed
    - escort_approved
    - escort_refused
    - escort_fulfilled
    - escort_vanguard
    - escort_quartermaster
  nodes:
    - id: deliver_verified_date
      from_state: uncommitted
      target_id: N03
      fact_id: F01
      min_confidence: 3
      action_id: broadcast
      choices:
        - id: tell:N03:F01:trust
          term_id: trust
          term_label: 无偿相助
          name: 无偿告知顾岚
          description: 不索取眼前回报，以可靠消息换取顾岚对你的长期信任。
          personal_outcome: 顾岚对你的信任提高；若他凭此回收跃迁核心，你会获得环站指挥部声望。
          expected_outcomes:
            - 顾岚获得已核实日期
            - 信任 +2，并可能直接采用你的消息提前备战
          warnings:
            - 条件一旦提出，数据与承诺都不可撤回。
          irreversible: true
          effects:
            - type: adjust_relation
              from_id: target
              target_id: player
              key: trust
              amount: 2
            - type: set_flag
              target_id: player
              key: command_deck_intel_term_trust
              value: "true"
            - type: set_flag
              target_id: world
              key: player_backed_shen
              value: "true"
          to_state: trust_committed
          feedback: {messages: [可靠数据已经交给顾岚，长期信任路线由此开启。], journal: [无偿向顾岚交付核实日期，等待环站指挥部审核与兑现。], presentation: {kind: actor_focus, intensity: 2, subject: target}}

        - id: tell:N03:F01:eva_suit
          term_id: eva_suit
          term_label: 交换舱外服
          name: 以日期换取舱外服
          description: 把已核实日期作为交易筹码，立即换取一枚舱外服，保留独自进入核心舱的自由。
          personal_outcome: 立即获得 1 枚舱外服，重新打开亲自进入核心舱路线。
          expected_outcomes:
            - 获得顾岚持有的 1 枚舱外服
            - 指挥部失去这套舱外服；顾岚会把数据视为一次对价交易
          warnings:
            - 条件一旦提出，数据与承诺都不可撤回。
          irreversible: true
          conditions:
            - type: missing_item
              key: eva_suit
          effects:
            - type: remove_item
              target_id: target
              key: eva_suit
              amount: 1
            - type: add_item
              target_id: player
              key: eva_suit
              amount: 1
            - type: set_flag
              target_id: player
              key: command_deck_intel_term_eva_suit
              value: "true"
            - type: set_flag
              target_id: world
              key: player_took_shen_eva_suit
              value: "true"
          to_state: eva_suit_committed
          feedback: {messages: [数据交易完成，你取得了环站指挥部的备用舱外服。], journal: [以核实日期换得舱外服，后续需要回应苏弥的物资请求。], presentation: {kind: acquire, intensity: 2, subject: player}}

        - id: tell:N03:F01:escort
          term_id: escort
          term_label: 换取同行名额
          name: 以日期换取同行承诺
          description: 暂不拿走物资，要求顾岚在指挥部集结时把你编入队伍。
          personal_outcome: 获得第17日随指挥部队伍出发的承诺；届时可领取随队物资与 1 点助力。
          expected_outcomes:
            - 顾岚获得已核实日期
            - 换取充能完成时随队出发的承诺，信任 +1
          warnings:
            - 条件一旦提出，数据与承诺都不可撤回。
          irreversible: true
          effects:
            - type: adjust_relation
              from_id: target
              target_id: player
              key: trust
              amount: 1
            - type: set_flag
              target_id: player
              key: command_deck_escort_promised
              value: "true"
            - type: set_flag
              target_id: player
              key: command_deck_intel_term_escort
              value: "true"
            - type: set_flag
              target_id: world
              key: player_joining_command_deck
              value: "true"
          to_state: escort_committed
          feedback: {messages: [顾岚接受条件，将你列入指挥部同行候选。], journal: [以核实日期换取同行承诺，仍需通过舰队审核。], presentation: {kind: actor_focus, intensity: 2, subject: target}}

    - id: answer_source_review
      from_state: trust_committed
      from_day: 10
      until_day: 12
      location_id: L02
      target_id: N09
      action_id: dock
      conditions:
        - {type: flag, key: n09_challenges_player_source}
        - {type: missing_flag, scope: actor, key: command_deck_trust_midgame_resolved}
      choices:
        - id: route:trust:vouch
          term_id: vouch
          term_label: 公开担保
          name: 为数据来源担保
          description: 在舰队审核中公开承担消息责任，不让顾岚独自承受赵鸣的质疑。
          command_description: 你在舰队审核中为数据来源担保
          personal_outcome: 声望 +1，顾岚信任 +1；同时坐实你与顾岚的共同立场。
          relevance: 赵鸣正在借舰队审核质疑这条消息的来源。
          risk: 担保会提高你的舰队声望，也会让赵鸣把你视为顾岚一方。
          expected_outcomes:
            - 声望 +1
            - 顾岚信任 +1
            - 完成信任路线的中段履约
          warnings:
            - 公开担保后，无法再否认自己参与了顾岚的计划。
          irreversible: true
          effects:
            - {type: adjust_resource, target_id: player, key: reputation, amount: 1}
            - {type: adjust_relation, from_id: N03, target_id: player, key: trust, amount: 1}
            - {type: set_flag, target_id: player, key: command_deck_trust_vouched, value: "true"}
            - {type: set_flag, target_id: player, key: command_deck_trust_midgame_resolved, value: "true"}
          to_state: trust_reviewed
          feedback: {messages: [你公开担保数据来源，环站指挥部审核记录了这份承诺。], journal: [在公开审核中支持顾岚，信任担保进入兑现阶段。], presentation: {kind: actor_focus, intensity: 2, subject: target}}

    - id: leak_plan_during_review
      from_state: trust_committed
      from_day: 10
      until_day: 12
      location_id: L02
      target_id: N09
      fact_id: F01
      min_confidence: 3
      action_id: broadcast
      conditions:
        - {type: flag, key: n09_challenges_player_source}
        - {type: missing_flag, scope: actor, key: command_deck_trust_midgame_resolved}
      choices:
        - id: route:trust:leak
          term_id: leak
          term_label: 转交计划
          name: 把计划转交赵鸣
          description: 否认担保，并把顾岚的完成充能日期与备战安排交给赵鸣换取报酬。
          command_description: 你把顾岚的计划转交赵鸣
          personal_outcome: 立即获得 20 配给点，但顾岚信任 -4，信任路线转为背约。
          relevance: 赵鸣需要证据削弱顾岚在指挥部的地位。
          risk: 这会把一次无偿相助变成背叛；顾岚会知道计划从你这里泄露。
          expected_outcomes:
            - 获得 20 配给点
            - 顾岚信任 -4
            - 赵鸣获得已核实日期
          warnings:
            - 这是信任路线的背约选择。
          irreversible: true
          effects:
            - {type: adjust_resource, target_id: player, key: credits, amount: 20}
            - {type: adjust_relation, from_id: N03, target_id: player, key: trust, amount: -4}
            - {type: set_flag, target_id: player, key: command_deck_trust_betrayed, value: "true"}
            - {type: set_flag, target_id: player, key: command_deck_trust_midgame_resolved, value: "true"}
          to_state: trust_betrayed
          feedback: {messages: [你把顾岚的计划交给赵鸣，原有信任已经破裂。], journal: [背弃指挥部数据担保并收取报酬，信任路线关闭。], presentation: {kind: danger, intensity: 3, subject: target}}

    - id: answer_eva_suit_request
      from_state: eva_suit_committed
      from_day: 8
      until_day: 12
      location_id: L02
      target_id: N06
      action_id: dock
      conditions:
        - {type: has_item, key: eva_suit}
        - {type: flag, key: su_requests_eva_suit}
        - {type: missing_flag, scope: actor, key: command_deck_eva_suit_midgame_resolved}
      choices:
        - id: route:eva_suit:lend
          term_id: lend
          term_label: 物资归队
          name: 把舱外服交回指挥部
          description: 接受苏弥的请求，把换来的舱外服交给指挥部维修组。
          command_description: 你把交易所得舱外服借给苏弥
          personal_outcome: 失去舱外服与独行资格，换得 2 点助力和苏弥 2 点信任。
          relevance: 补给环已经封锁，苏弥无法为队伍补回这枚舱外服。
          risk: 交出后你的亲自进入核心舱路线会再次关闭。
          expected_outcomes:
            - 助力 +2
            - 苏弥信任 +2
            - 交出 1 枚舱外服
          warnings:
            - 交出后将失去当前的独自进入核心舱条件。
          irreversible: true
          effects:
            - {type: remove_item, target_id: player, key: eva_suit, amount: 1}
            - {type: add_item, target_id: N06, key: eva_suit, amount: 1}
            - {type: adjust_resource, target_id: player, key: crew_support, amount: 2}
            - {type: adjust_relation, from_id: N06, target_id: player, key: trust, amount: 2}
            - {type: set_flag, target_id: player, key: command_deck_eva_suit_lent, value: "true"}
            - {type: set_flag, target_id: player, key: command_deck_eva_suit_midgame_resolved, value: "true"}
          to_state: eva_suit_lent
          feedback: {messages: [你把舱外服交回指挥部，独行资格转化为助力与信任。], journal: [响应苏弥的物资请求，放弃独行路线。], presentation: {kind: actor_focus, intensity: 2, subject: target}}
        - id: route:eva_suit:keep
          term_id: keep
          term_label: 坚持独行
          name: 拒绝归还舱外服
          description: 明确告诉苏弥，这枚维修耗材是一次完成的交易，你会保留它并独自决定进入核心舱时机。
          command_description: 你拒绝把交易所得舱外服交回指挥部
          personal_outcome: 保留舱外服与路线自由；苏弥对你的怀疑 +2。
          relevance: 苏弥把维修组的物资缺口摆到了你面前。
          risk: 你仍可独行，但指挥部维修组不会再向你托付物资。
          expected_outcomes:
            - 保留舱外服
            - 苏弥怀疑 +2
            - 确认独行路线
          warnings:
            - 拒绝后，苏弥不会再次提出物资请求。
          irreversible: true
          effects:
            - {type: adjust_relation, from_id: N06, target_id: player, key: suspicion, amount: 2}
            - {type: set_flag, target_id: player, key: command_deck_eva_suit_kept, value: "true"}
            - {type: set_flag, target_id: player, key: command_deck_eva_suit_midgame_resolved, value: "true"}
          to_state: eva_suit_kept
          feedback: {messages: [你拒绝归还舱外服，保住独行资格，也承担了关系代价。], journal: [拒绝归还物资并确认独行，等待选择踩点或变现。], presentation: {kind: danger, intensity: 2, subject: target}}

    - id: answer_escort_review
      from_state: escort_committed
      from_day: 10
      until_day: 13
      location_id: L02
      target_id: N03
      action_id: dock
      conditions:
        - {type: flag, key: command_deck_review}
        - {type: flag, scope: actor, key: command_deck_escort_promised}
        - {type: missing_flag, scope: actor, key: command_deck_escort_midgame_resolved}
      choices:
        - id: route:escort:review
          term_id: review
          term_label: 接受审核
          name: 接受环站指挥部审核
          description: 登记数据来源与行动职责，以正式队员身份保留同行资格。
          command_description: 你接受环站指挥部同行审核
          personal_outcome: 声望 +1、顾岚信任 +1，并保留第16日随队集结资格。
          relevance: 环站指挥部要求所有参与者登记数据与职责。
          risk: 通过审核后，赫利俄斯财团会把你视为环站指挥部行动的一员。
          expected_outcomes:
            - 声望 +1
            - 顾岚信任 +1
            - 保留同行资格
          warnings:
            - 你的阵营立场将变得公开。
          irreversible: true
          effects:
            - {type: adjust_resource, target_id: player, key: reputation, amount: 1}
            - {type: adjust_relation, from_id: N03, target_id: player, key: trust, amount: 1}
            - {type: set_flag, target_id: player, key: command_deck_escort_approved, value: "true"}
            - {type: set_flag, target_id: player, key: command_deck_escort_midgame_resolved, value: "true"}
          to_state: escort_approved
          feedback: {messages: [舰队审核通过，同行承诺只待充能完成前集结兑现。], journal: [通过指挥部同行审核，第16日必须返回驻地集结。], presentation: {kind: actor_focus, intensity: 2, subject: target}}
        - id: route:escort:independent
          term_id: independent
          term_label: 保持独立
          name: 退出指挥部同行名单
          description: 拒绝舰队审核，保留自由工程师身份并放弃此前换得的同行名额。
          command_description: 你拒绝环站指挥部审核并退出同行名单
          personal_outcome: 放弃随队物资与助力；顾岚信任 -2，赫克托不再把你视为指挥部阵营。
          relevance: 舰队审核要求你在安全与独立之间作出明确选择。
          risk: 退出后，第16日不会再出现随队集结。
          expected_outcomes:
            - 取消同行承诺
            - 顾岚信任 -2
            - 恢复公开的自由工程师身份
          warnings:
            - 退出后不能重新申请本次同行。
          irreversible: true
          effects:
            - {type: adjust_relation, from_id: N03, target_id: player, key: trust, amount: -2}
            - {type: adjust_relation, from_id: N02, target_id: player, key: suspicion, amount: -1}
            - {type: set_flag, target_id: player, key: command_deck_escort_promised, value: "false"}
            - {type: set_flag, target_id: player, key: command_deck_escort_refused, value: "true"}
            - {type: set_flag, target_id: player, key: command_deck_escort_midgame_resolved, value: "true"}
            - {type: set_flag, target_id: world, key: player_declared_independent, value: "true"}
          to_state: escort_refused
          feedback: {messages: [你退出指挥部同行名单，重新以独立自由工程师身份行动。], journal: [拒绝舰队审核并退出同行路线。], presentation: {kind: actor_focus, intensity: 2, subject: target}}

    - id: settle_trust_commitment
      from_state: trust_reviewed
      from_day: 14
      until_day: 16
      location_id: L02
      target_id: N03
      allow_remote_target: true
      action_id: dock
      conditions:
        - {type: flag, scope: actor, key: command_deck_trust_vouched}
        - {type: missing_flag, scope: actor, key: command_deck_trust_late_resolved}
      choices:
        - id: route:trust:join
          term_id: join
          term_label: 亲自入局
          name: 把担保转为行动席位
          description: 以已经公开承担的责任换取环站指挥部行动物资，亲自加入进入核心舱准备。
          personal_outcome: 获得舱外服、2 点助力与额外筹备；你可以亲自争夺跃迁核心。
          relevance: 你已经替顾岚承担消息责任，有资格要求行动资源。
          risk: 亲自加入会消耗舰队人手，也意味着你要承担进入核心舱风险。
          expected_outcomes:
            - 获得 1 枚舱外服
            - 助力 +2
            - 形成额外筹备
          warnings:
            - 选择行动席位后，本轮不能再领取数据报酬。
          irreversible: true
          effects:
            - {type: add_item, target_id: player, key: eva_suit, amount: 1}
            - {type: adjust_resource, target_id: player, key: crew_support, amount: 2}
            - {type: set_flag, target_id: player, key: prepared, value: "true"}
            - {type: set_flag, target_id: player, key: command_deck_trust_operation_joined, value: "true"}
            - {type: set_flag, target_id: player, key: command_deck_trust_late_resolved, value: "true"}
          to_state: trust_joined
          feedback: {messages: [担保已经兑现为行动席位，进入核心舱物资与助力交到你手中。], journal: [将指挥部信任回报兑现为亲自行动条件。], presentation: {kind: acquire, intensity: 3, subject: player}}
        - id: route:trust:commission
          term_id: commission
          term_label: 领取报酬
          name: 结算数据与担保报酬
          description: 不占用环站指挥部行动席位，提前结算数据交叉校验与公开担保的报酬。
          personal_outcome: 立即获得 30 配给点与 1 点声望；保留顾岚获胜后的记功可能。
          relevance: 可靠消息与公开担保已经替环站指挥部节省了交叉校验成本。
          risk: 你不会获得舰队物资，若要亲自争夺仍需自行准备。
          expected_outcomes:
            - 获得 30 配给点
            - 声望 +1
          warnings:
            - 领取报酬后，本轮不能再申请行动席位。
          irreversible: true
          effects:
            - {type: adjust_resource, target_id: player, key: credits, amount: 30}
            - {type: adjust_resource, target_id: player, key: reputation, amount: 1}
            - {type: set_flag, target_id: player, key: command_deck_trust_commissioned, value: "true"}
            - {type: set_flag, target_id: player, key: command_deck_trust_late_resolved, value: "true"}
          to_state: trust_commissioned
          feedback: {messages: [你选择结清数据报酬，不再占用环站指挥部行动席位。], journal: [将信任担保结算为配给点与声望。], presentation: {kind: acquire, intensity: 2, subject: player}}

    - id: turn_eva_suit_into_route
      from_state: eva_suit_kept
      from_day: 13
      until_day: 16
      location_id: L02
      target_id: N06
      allow_remote_target: true
      action_id: dock
      conditions:
        - {type: has_item, key: eva_suit}
        - {type: flag, scope: actor, key: command_deck_eva_suit_kept}
        - {type: missing_flag, scope: actor, key: command_deck_eva_suit_late_resolved}
      choices:
        - id: route:eva_suit:scout
          term_id: scout
          term_label: 独行踩点
          name: 用舱外服提前踩点
          description: 保留维修耗材并独自勘察维护环入口裂隙，把进入核心舱自由转化为路线优势。
          personal_outcome: 保留舱外服，获得 2 点助力与额外筹备，提高核心争夺胜算。
          relevance: 你拥有封锁后的稀缺维修耗材，可以比普通自由工程师更早勘察维护环。
          risk: 独行踩点不会修复苏弥对你的怀疑。
          expected_outcomes:
            - 保留舱外服
            - 助力 +2
            - 形成额外筹备
          warnings:
            - 完成踩点后，不能再拍卖本轮进入核心舱名额。
          irreversible: true
          effects:
            - {type: adjust_resource, target_id: player, key: crew_support, amount: 2}
            - {type: set_flag, target_id: player, key: prepared, value: "true"}
            - {type: set_flag, target_id: player, key: command_deck_eva_suit_scouted, value: "true"}
            - {type: set_flag, target_id: player, key: command_deck_eva_suit_late_resolved, value: "true"}
          to_state: eva_suit_scouted
          feedback: {messages: [提前踩点完成，舱外服和新增准备都得以保留。], journal: [使用舱外服完成独行踩点，核心争夺准备提高。], presentation: {kind: reveal, intensity: 2, subject: fact}}

    - id: liquidate_eva_suit_route
      from_state: eva_suit_kept
      from_day: 13
      until_day: 16
      location_id: L02
      target_id: N04
      allow_remote_target: true
      action_id: dock
      conditions:
        - {type: has_item, key: eva_suit}
        - {type: flag, scope: actor, key: command_deck_eva_suit_kept}
        - {type: missing_flag, scope: actor, key: command_deck_eva_suit_late_resolved}
      choices:
        - id: route:eva_suit:liquidate
          term_id: liquidate
          term_label: 变现资格
          name: 转售维修耗材与进入核心舱路线
