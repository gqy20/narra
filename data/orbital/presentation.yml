brand: 远星环站
world_title: 远星环站轨道结构
objective: 跃迁核心将在这里决定归属
intro: 三十日内，跃迁核心的归属将被决定。你未必亲手夺取它，也能让一条消息改写别人的去向。
prologue:
  skippable: true
  beats:
  - text: |-
      远星环站。
      一座正在失去维护配额的轨道结构。
    duration: 2.5
    font: display
    font_size: 37
    position: center
  - text: |-
      三十日后，跃迁核心将完成充能。
      船团、站务与承包商都想取得控制权。
    duration: 3.5
    font: narrative
    font_size: 29
    position: lower_left
  - text: |-
      你未必能直接接触核心。
      一条经过交叉校验的遥测记录，也能改变别人的航线。
    duration: 3.7
    font: body
    font_size: 28
    position: lower_center
  - text: |-
      从白石补给环入局。
      在充能完成前，决定谁会抵达核心舱。
    await_input: true
    font: display
    font_size: 30
    position: lower_center
start_action: 从白石补给环入局
resources:
- {id: integrity, label: 系统完整度, emphasis: normal}
- {id: credits, label: 配给点, emphasis: accent}
- {id: crew_support, label: 助力, emphasis: success, hide_zero: true}
- {id: reputation, label: 声望, emphasis: normal, hide_zero: true}
