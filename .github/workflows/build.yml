name: Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1.stable
  BUILD_VERSION: ci-${{ github.run_number }}

jobs:
  windows:
    name: Windows x86_64 artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Godot editor
        shell: pwsh
        run: |
          $tag = $env:GODOT_VERSION.Replace('.stable', '-stable')
          $archiveVersion = $env:GODOT_VERSION.Replace('.stable', '-stable')
          $url = "https://github.com/godotengine/godot-builds/releases/download/$tag/Godot_v${archiveVersion}_win64.exe.zip"
          $installDirectory = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Path $installDirectory -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $installDirectory
          $editor = Get-ChildItem -LiteralPath $installDirectory -Filter 'Godot_v*_win64.exe' -File | Select-Object -First 1
          $console = Get-ChildItem -LiteralPath $installDirectory -Filter 'Godot_v*_win64_console.exe' -File | Select-Object -First 1
          if ($null -eq $editor -or $null -eq $console) { throw 'Godot editor executable pair was not found.' }
          Copy-Item -LiteralPath $editor.FullName -Destination (Join-Path $installDirectory 'godot.exe')
          Copy-Item -LiteralPath $console.FullName -Destination (Join-Path $installDirectory 'godot_console.exe')
          $shimDirectory = Join-Path $env:RUNNER_TEMP 'godot-bin'
          New-Item -ItemType Directory -Path $shimDirectory -Force | Out-Null
          $shim = "@echo off`r`n`"$(Join-Path $installDirectory 'godot_console.exe')`" %*"
          Set-Content -LiteralPath (Join-Path $shimDirectory 'godot.cmd') -Value $shim -Encoding ascii
          $shimDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Windows export templates
        shell: pwsh
        run: python tools/install-godot-templates.py --platform windows --version $env:GODOT_VERSION
      - name: Build and smoke-test package
        shell: pwsh
        run: ./tools/build-windows.ps1 -SkipTests -Version $env:BUILD_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: narra-windows-x86_64-${{ github.run_number }}
          path: dist/narra-windows-x86_64-${{ env.BUILD_VERSION }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos:
    name: macOS Universal artifact (unsigned)
    # Godot 4.7.1 still invokes lipo with the syntax accepted by Xcode 16.
    # Pin the image so a macos-latest/Xcode 26 rollout cannot break exports.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Godot editor
        shell: bash
        run: |
          tag="${GODOT_VERSION/.stable/-stable}"
          archive_version="${GODOT_VERSION/.stable/-stable}"
          url="https://github.com/godotengine/godot-builds/releases/download/$tag/Godot_v${archive_version}_macos.universal.zip"
          curl --fail --location --retry 3 "$url" --output "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install macOS export template
        run: python3 tools/install-godot-templates.py --platform macos --version "$GODOT_VERSION"
      - name: Build and smoke-test package
        env:
          SKIP_TESTS: "1"
        run: bash tools/build-macos.sh "$BUILD_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: narra-macos-universal-unsigned-${{ github.run_number }}
          path: dist/narra-macos-universal-${{ env.BUILD_VERSION }}-unsigned.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
