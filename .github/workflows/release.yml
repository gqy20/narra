name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1.stable

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Match tag and project version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^config\/version="\([^"]*\)"/\1/p' godot/project.godot)"
          if [[ -z "$version" || "$version" != "$project_version" ]]; then
            echo "Tag version $version does not match Godot project version $project_version" >&2
            exit 1
          fi
          if ! grep -Eq "^## \\[$version\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated release entry for version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run deterministic verification
        shell: pwsh
        run: ./tools/verify.ps1

  windows:
    name: Windows x86_64 package
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Godot editor
        shell: pwsh
        run: |
          $tag = $env:GODOT_VERSION.Replace('.stable', '-stable')
          $archiveVersion = $env:GODOT_VERSION.Replace('.stable', '-stable')
          $url = "https://github.com/godotengine/godot-builds/releases/download/$tag/Godot_v${archiveVersion}_win64.exe.zip"
          $installDirectory = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Path $installDirectory -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $installDirectory
          $editor = Get-ChildItem -LiteralPath $installDirectory -Filter 'Godot_v*_win64.exe' -File | Select-Object -First 1
          $console = Get-ChildItem -LiteralPath $installDirectory -Filter 'Godot_v*_win64_console.exe' -File | Select-Object -First 1
          if ($null -eq $editor -or $null -eq $console) { throw 'Godot editor executable pair was not found.' }
          Copy-Item -LiteralPath $editor.FullName -Destination (Join-Path $installDirectory 'godot.exe')
          Copy-Item -LiteralPath $console.FullName -Destination (Join-Path $installDirectory 'godot_console.exe')
          $shimDirectory = Join-Path $env:RUNNER_TEMP 'godot-bin'
          New-Item -ItemType Directory -Path $shimDirectory -Force | Out-Null
          $shim = "@echo off`r`n`"$(Join-Path $installDirectory 'godot_console.exe')`" %*"
          Set-Content -LiteralPath (Join-Path $shimDirectory 'godot.cmd') -Value $shim -Encoding ascii
          $shimDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Windows export templates
        run: python tools/install-godot-templates.py --platform windows --version $env:GODOT_VERSION
      - name: Run complete Godot gate
        shell: pwsh
        run: ./tools/verify-godot.ps1 -Mode full
      - name: Build and smoke-test package
        shell: pwsh
        run: ./tools/build-windows.ps1 -SkipTests -Version "${{ needs.validate.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: narra-windows-x86_64
          path: dist/narra-windows-x86_64-${{ needs.validate.outputs.version }}.zip
          if-no-files-found: error

  macos:
    name: macOS Universal package (unsigned)
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Godot editor
        shell: bash
        run: |
          tag="${GODOT_VERSION/.stable/-stable}"
          archive_version="${GODOT_VERSION/.stable/-stable}"
          url="https://github.com/godotengine/godot-builds/releases/download/$tag/Godot_v${archive_version}_macos.universal.zip"
          curl --fail --location --retry 3 "$url" --output "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install macOS export template
        run: python3 tools/install-godot-templates.py --platform macos --version "$GODOT_VERSION"
      - name: Build and smoke-test package
        env:
          SKIP_TESTS: "1"
        run: bash tools/build-macos.sh "${{ needs.validate.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: narra-macos-universal-unsigned
          path: dist/narra-macos-universal-${{ needs.validate.outputs.version }}-unsigned.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64 package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Godot editor
        shell: bash
        run: |
          tag="${GODOT_VERSION/.stable/-stable}"
          archive_version="${GODOT_VERSION/.stable/-stable}"
          url="https://github.com/godotengine/godot-builds/releases/download/$tag/Godot_v${archive_version}_linux.x86_64.zip"
          curl --fail --location --retry 3 "$url" --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mkdir -p "$RUNNER_TEMP/bin"
          editor="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' -print -quit)"
          test -n "$editor"
          chmod +x "$editor"
          ln -s "$editor" "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install Linux export templates
        run: python3 tools/install-godot-templates.py --platform linux --version "$GODOT_VERSION"
      - name: Build and smoke-test package
        env:
          SKIP_TESTS: "1"
        run: bash tools/build-linux.sh "${{ needs.validate.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: narra-linux-x86_64
          path: dist/narra-linux-x86_64-${{ needs.validate.outputs.version }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [validate, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Build release notes and checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1 }
            found && index($0, "## [") == 1 && index($0, heading) != 1 { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No changelog entry found for version $version" >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum *.zip *.tar.gz > checksums.txt
          )
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/*.zip
          release-assets/*.tar.gz
          release-assets/checksums.txt
          --verify-tag
          --notes-file release-notes.md
          --repo "$GITHUB_REPOSITORY"
          --title "Narra $GITHUB_REF_NAME"
